<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>2×2 Voix</title>
    <script>
      // Redirige les URLs profondes (ex. /concerts/id) vers index.html en encodant
      // le chemin dans le query string, faute de routage serveur sur GitHub Pages.
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
