<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2×2 Voix — Quatuor vocal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Playfair+Display:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ==============================================
       Print stylesheet — 2×2 Voix
       ============================================== */
    @page {
      size: A4 portrait;
      margin: 14mm 14mm;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      html, body {
        background: var(--color-bg-default) !important;
      }

      /* Hide chrome / interactive things */
      .nav,
      .tweaks-panel,
      .tweaks-toggle,
      [data-cc-id],
      button[aria-label="Tweaks"],
      .form__submit,
      .nav__cta {
        display: none !important;
      }

      /* Re-flow shells: drop max-widths / center on the page */
      .section, .rep__inner, .contact__inner, .hero {
        padding: 0 !important;
        max-width: 100% !important;
        margin: 0 !important;
      }

      main { display: block; }

      /* Each top-level section starts a new page */
      #hero { break-after: page; page-break-after: always; }
      #quatuor { break-before: page; page-break-before: always; break-after: page; page-break-after: always; }
      #agenda { break-before: page; page-break-before: always; break-after: page; page-break-after: always; }
      #repertoire { break-before: page; page-break-before: always; break-after: page; page-break-after: always; }
      #ecouter { break-before: page; page-break-before: always; break-after: page; page-break-after: always; }
      #galerie { break-before: page; page-break-before: always; break-after: page; page-break-after: always; }
      #contact { break-before: page; page-break-before: always; }

      /* avoid splitting these */
      .event, .famcard, .track, .gallery__item, .voicemark, .pcard, .duo {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Hero — keep it readable on a single portrait page */
      .hero { padding-top: 8mm !important; }
      .hero__grid {
        grid-template-columns: 1fr !important;
        min-height: auto !important;
        gap: 18mm !important;
        align-items: start !important;
      }
      .hero__copy { padding-left: 0 !important; text-align: left; }
      .hero__formula { font-size: 200px !important; }
      .hero__title { font-size: 44px !important; }
      .hero__sub { font-size: 14px !important; }
      .hero__ctas { display: none !important; }
      .hero__portraits {
        grid-template-columns: repeat(2, 1fr) !important;
        max-width: 120mm;
        margin: 0 auto;
      }

      /* Section titles slightly smaller for paper */
      .section__title { font-size: 36px !important; }
      .section__lede { font-size: 14px !important; }
      .section__label { font-size: 10px !important; }

      /* Repertoire — keep the 3-column on a landscape-y portrait page */
      .famcards {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 8px !important;
      }
      .famcard { padding: 16px !important; }
      .famcard__title { font-size: 22px !important; }
      .famcard__desc { font-size: 12px !important; }
      .famcard__composer { font-size: 10px !important; padding: 3px 7px !important; }
      .famcard__signature-title { font-size: 14px !important; }
      .famcard__roman { font-size: 22px !important; }

      /* Agenda */
      .event {
        grid-template-columns: 110px 1fr !important;
        gap: 18px !important;
        padding: 18px !important;
      }
      .event__actions { display: none !important; }
      .event__title { font-size: 18px !important; }
      .event__date-day { font-size: 38px !important; }

      /* Listen — single column, smaller */
      .listen__grid { grid-template-columns: 1fr 1fr 1fr !important; gap: 10px !important; }
      .track { padding: 14px !important; }
      .track__title { font-size: 13px !important; }

      /* Gallery — keep grid but flatten */
      .gallery {
        grid-template-columns: repeat(3, 1fr) !important;
        grid-auto-rows: 60mm !important;
        gap: 6px !important;
      }
      .gallery__item--wide { grid-column: span 2 !important; }
      .gallery__item--tall { grid-row: auto !important; }

      /* Contact — flatten the dark background block so it prints well */
      .contact { background: var(--color-bg-default) !important; color: var(--color-text-primary) !important; }
      .contact__inner {
        grid-template-columns: 1fr 1.2fr !important;
        gap: 24mm !important;
        padding: 0 !important;
      }
      .contact__title { color: var(--color-primary-dark) !important; font-size: 32px !important; }
      .contact__sub { color: var(--color-text-secondary) !important; }
      .contact__detail { color: var(--color-text-primary) !important; }
      .field__label { color: var(--color-text-muted) !important; }
      .field__input, .field__select, .field__textarea {
        background: #fff !important;
        border: 1px solid var(--color-border) !important;
        color: var(--color-text-primary) !important;
      }
      .form__success { background: var(--color-bg-active) !important; color: var(--color-primary-dark) !important; }

      /* Footer */
      .footer { background: var(--color-bg-default) !important; color: var(--color-text-muted) !important; padding: 8mm 0 !important; }
      .footer__brand { color: var(--color-primary-dark) !important; }

      /* Make voicemarks border tone usable on white paper */
      .voicemarks { border-color: var(--color-border) !important; }

      /* Pcard hover removal */
      .pcard:hover { transform: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    // Auto-print: wait for fonts + initial render + a small buffer
    (async () => {
      try {
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
        // Wait two RAFs to ensure React has rendered
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        // Extra safety delay for late layout / SVG paints
        await new Promise((r) => setTimeout(r, 700));
        window.print();
      } catch (e) {
        setTimeout(() => window.print(), 1500);
      }
    })();
  </script>
</body>
</html>
